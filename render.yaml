services:
  # 1. Render Web Service (Node/Express API)
  - type: web
    name: sonam-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm run setup && npm run build
    startCommand: npm start --workspace=server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://sonam.puspender.in
      - key: CORS_ORIGINS
        value: https://sonam.puspender.in
      # Set DATABASE_URL, OPENAI_API_KEY, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY in Render Dashboard Environment Variables

  # 2. Render Cron Job (Independent Background Reminder Worker)
  - type: cron
    name: sonam-reminder-worker
    env: node
    region: singapore
    schedule: "* * * * *"
    buildCommand: npm run setup && npm run build
    startCommand: npm run cron:reminders
    envVars:
      - key: NODE_ENV
        value: production
      # Inherits DATABASE_URL and VAPID keys from environment
